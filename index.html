<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memento - Notes App</title>
    <meta
      name="description"
      content="Memento - Aplikasi catatan sederhana dan imut untuk mencatat ide dan momen berharga."
    />

    <!-- Favicon -->
    <!-- <link rel="icon" type="image/png" href="public/memento_logo.png" /> -->

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Quicksand:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <!-- <link rel="stylesheet" href="style.css" /> -->
  </head>
  <body>
    <!-- App Bar -->
    <app-bar>
      <header class="app-bar">
        <img src="memento_logo.png" alt="Memento Logo" class="logo" />
        <h1>Memento Notes</h1>
      </header>
    </app-bar>

    <!-- Main Content -->
    <main class="container">
      <!-- Form Tambah Catatan -->
      <note-form></note-form>
      <loading-indicator id="loader" style="display:none"></loading-indicator>

      <!-- List Catatan -->
      <section>
        <h1 class="notes-title">Catatan Aktif</h1>
        <div id="active-notes" class="notes-grid"></div>
      </section>

      <section>
        <h1 class="notes-title">Catatan Arsip</h1>
        <div id="archived-notes" class="notes-grid"></div>
      </section>
    </main>
    <footer-bar></footer-bar>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <!-- <script type="module" src="app.js"></script> -->
  </body>
</html>
